<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Gemini AI Chat</h1>
        <p>محادثة مباشرة مع Gemini — GitHub Pages</p>
      </div>
      <button id="clearBtn" class="secondary">مسح المحادثة</button>
    </header>

    <section class="settings card">
      <label for="apiKey">Gemini API Key</label>
      <div class="key-row">
        <input id="apiKey" type="password" placeholder="ضع مفتاح Gemini هنا">
        <button id="toggleKey" class="secondary">إظهار</button>
        <button id="saveKey">حفظ</button>
      </div>
      <small>
        المفتاح يُحفظ في هذا المتصفح فقط. لا تضعه في GitHub إن كنت لا تريد أن يراه الآخرون.
      </small>

      <label for="model">النموذج</label>
      <select id="model">
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        <option value="gemini-3.6-flash">gemini-3.6-flash</option>
      </select>
    </section>

    <section id="chat" class="chat card">
      <div class="welcome">
        <h2>ابدأ المحادثة</h2>
        <p>اكتب سؤالك في الأسفل، وسيتم إرسال الطلب مباشرة إلى Gemini API.</p>
      </div>
    </section>

    <form id="form" class="composer card">
      <textarea id="prompt" rows="3" placeholder="اكتب رسالتك هنا..." required></textarea>
      <button id="sendBtn" type="submit">إرسال</button>
    </form>

    <div id="status" class="status"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
